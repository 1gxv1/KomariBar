name: macOS 构建与测试

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建、测试和打包
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 显示工具链
        run: swift --version
      - name: 编译
        run: swift build
      - name: 测试
        run: swift test
      - name: 打包应用
        run: ./scripts/build-app.sh
      - name: 压缩应用
        run: ditto -c -k --sequesterRsrc --keepParent dist/KomariBar.app dist/KomariBar-macos.zip
      - name: 保存构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KomariBar-macos-${{ runner.arch }}
          path: dist/KomariBar-macos.zip
          if-no-files-found: error
          retention-days: 14
